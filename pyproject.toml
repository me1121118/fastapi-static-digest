[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-static-digest"
version = "0.1.0"
description = "Cache-busting static file server and manifest generator for FastAPI with immutable HTTP headers"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "me1121118" }
]
keywords = ["fastapi", "python", "utility", "tools"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ["starlette>=0.27.0"]

[project.urls]
Homepage = "https://github.com/me1121118/fastapi-static-digest"
Repository = "https://github.com/me1121118/fastapi-static-digest"
